# Development-only values, used by `./mvnw spring-boot:run`. Never deploy with this profile.
sprintmodus.jwt.secret=dev-only-jwt-secret-do-not-use-in-production-0123456789-0123456789-abcdef
sprintmodus.tenant-credentials.encryption-password=dev-only-credentials-key
sprintmodus.tenant-credentials.salt=deadbeefdeadbeef

# MySQL 8.4+ authenticates with caching_sha2_password, which needs this on a connection without TLS
spring.datasource.master.jdbc-url=jdbc:mysql://localhost:3306/master_db?connectionTimeZone=UTC&allowPublicKeyRetrieval=true
spring.datasource.tenant.jdbc-parameters=connectionTimeZone=UTC&allowPublicKeyRetrieval=true
