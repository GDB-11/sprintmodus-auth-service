spring.application.name=auth-service

server.port=8091
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# Register by IP: the machine hostname is not resolvable by the gateway's Netty DNS resolver
eureka.instance.prefer-ip-address=true

# Two persistence units (master + tenant) are configured by hand; no session is held open across the view
spring.jpa.open-in-view=false

# Master DB. Its Flyway scripts come from the db-master jar and run at startup.
spring.datasource.master.jdbc-url=${MASTER_DB_URL:jdbc:mysql://localhost:3306/master_db?connectionTimeZone=UTC}
spring.datasource.master.username=${MASTER_DB_USERNAME:root}
spring.datasource.master.password=${MASTER_DB_ROOT_PASSWORD:password}

# Tenant DBs share one MySQL instance; only the database name differs (tenant_{tenantId without dashes})
spring.datasource.tenant.host=${TENANT_DB_HOST:localhost}
spring.datasource.tenant.port=${TENANT_DB_PORT:3306}
spring.datasource.tenant.username=${TENANT_DB_USERNAME:root}
spring.datasource.tenant.password=${MASTER_DB_ROOT_PASSWORD:password}
spring.datasource.tenant.max-pool-size=5
spring.datasource.tenant.jdbc-parameters=${TENANT_DB_JDBC_PARAMETERS:connectionTimeZone=UTC}

# Secrets have no default: the service refuses to start without them. `spring-boot:run` activates the `dev` profile,
# which supplies development-only values.
sprintmodus.jwt.secret=${JWT_SECRET:}
sprintmodus.jwt.issuer=sprintmodus-auth
sprintmodus.jwt.expiration=PT1H
sprintmodus.tenant-credentials.encryption-password=${TENANT_CREDENTIALS_KEY:}
sprintmodus.tenant-credentials.salt=${TENANT_CREDENTIALS_SALT:}

# Container health check: only the health group is exposed, without details. Liveness needs neither the database nor Eureka.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# The tenant DataSource routes by the caller's tenant, so a health check (no tenant) must not query it
management.health.db.enabled=false

# Finish in-flight requests on SIGTERM (docker stop) before exiting
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
