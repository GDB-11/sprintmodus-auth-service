spring.application.name=auth-service

server.port=8091
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register by IP: the machine hostname is not resolvable by the gateway's Netty DNS resolver
eureka.instance.prefer-ip-address=true

# Two persistence units (master + tenant) are configured by hand; no session is held open across the view
spring.jpa.open-in-view=false

# Master DB. Its Flyway scripts come from the db-master jar and run at startup.
spring.datasource.master.jdbc-url=jdbc:mysql://localhost:3306/master_db?connectionTimeZone=UTC
spring.datasource.master.username=root
spring.datasource.master.password=${MASTER_DB_ROOT_PASSWORD:password}

# Tenant DBs share one MySQL instance; only the database name differs (tenant_{tenantId without dashes})
spring.datasource.tenant.host=localhost
spring.datasource.tenant.port=3306
spring.datasource.tenant.username=root
spring.datasource.tenant.password=${MASTER_DB_ROOT_PASSWORD:password}
spring.datasource.tenant.max-pool-size=5

# Secrets have no default: the service refuses to start without them. `spring-boot:run` activates the `dev` profile,
# which supplies development-only values.
sprintmodus.jwt.secret=${JWT_SECRET:}
sprintmodus.jwt.issuer=sprintmodus-auth
sprintmodus.jwt.expiration=PT1H
sprintmodus.tenant-credentials.encryption-password=${TENANT_CREDENTIALS_KEY:}
sprintmodus.tenant-credentials.salt=${TENANT_CREDENTIALS_SALT:}
